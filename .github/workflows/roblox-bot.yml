name: 🤖 Roblox Cloud Bot

on:
  workflow_dispatch:
    inputs:
      game_link:
        description: '🔗 Ссылка на игру'
        required: true
        type: string
      action:
        description: '🎯 Действие'
        required: true
        type: choice
        options:
          - stand_and_wait
          - walk_to_player
          - take_item
          - leave_game
      duration:
        description: '⏱ Время (сек)'
        required: false
        type: number
        default: 60
      user_password:
        description: '🔐 Пароль'
        required: true
        type: string

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup Wine & Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 xvfb xdotool scrot
          pip install pyautogui
      - name: Run Bot
        env:
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          USER_PASSWORD: ${{ github.event.inputs.user_password }}
          GAME_LINK: ${{ github.event.inputs.game_link }}
          ACTION: ${{ github.event.inputs.action }}
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          python bot.py