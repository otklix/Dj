name: 🤖 Roblox Bot

on:
  workflow_dispatch:
    inputs:
      game_link:
        description: '🔗 Ссылка на игру'
        required: true
        type: string
      action:
        description: '🎯 Действие'
        required: true
        type: choice
        options:
          - stand_and_wait
          - walk_to_player
          - take_item
          - leave_game
      duration:
        description: '⏱ Время (сек)'
        required: false
        type: string
        default: '60'
      target_nick:
        description: '👤 Кому отправить запрос'
        required: false
        type: string
        default: 'ВашНик'
      login:
        description: '👤 Логин'
        required: true
        type: string
      password:
        description: '🔐 Пароль'
        required: true
        type: string

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Setup Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb
          # Устанавливаем Chrome
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          # Устанавливаем ChromeDriver
          wget https://storage.googleapis.com/chrome-for-testing-public/123.0.6312.122/linux64/chromedriver-linux64.zip
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          chmod +x /usr/local/bin/chromedriver
      
      - name: Setup Wine & Python packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 xvfb xdotool scrot
          pip install pyautogui requests selenium
      
      - name: Run Bot
        env:
          GAME_LINK: ${{ github.event.inputs.game_link }}
          ACTION: ${{ github.event.inputs.action }}
          DURATION: ${{ github.event.inputs.duration }}
          TARGET_NICK: ${{ github.event.inputs.target_nick }}
          LOGIN: ${{ github.event.inputs.login }}
          PASSWORD: ${{ github.event.inputs.password }}
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          python bot.py