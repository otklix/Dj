name: 🤖 Roblox Cloud Bot

on:
  workflow_dispatch:
    inputs:
      game_link:
        description: '🔗 Ссылка на приватный сервер Roblox'
        required: true
        type: string
        default: 'https://www.roblox.com/games/123456789/Private-Server'
      action:
        description: '🎯 Действие бота'
        required: true
        type: choice
        options:
          - stand_and_wait
          - walk_to_player
          - take_item
          - leave_game
      duration:
        description: '⏱ Время ожидания (сек)'
        required: false
        type: number
        default: 60
      user_password:
        description: '🔐 ВАШ ПАРОЛЬ (введите секретный пароль)'
        required: true
        type: string
        default: ''

jobs:
  roblox-bot:
    name: 🚀 Запуск Roblox бота
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 📥 Клонирование
        uses: actions/checkout@v4  # Обновлено до v4
      
      - name: 🐍 Установка Python
        uses: actions/setup-python@v5  # Обновлено до v5
        with:
          python-version: '3.10'
      
      - name: 📦 Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wine64 wine32 xvfb x11vnc xdotool \
            imagemagick wget unzip python3-pip
          pip install -r bot/requirements.txt
      
      - name: 🎮 Установка Roblox
        run: |
          wget https://setup.rbxcdn.com/RobloxPlayerLauncher.exe -O /tmp/RobloxPlayerLauncher.exe
          WINEPREFIX=/home/runner/.wine wine /tmp/RobloxPlayerLauncher.exe /silent
          sleep 30
      
      - name: 🤖 Запуск бота
        env:
          GAME_LINK: ${{ github.event.inputs.game_link }}
          ACTION: ${{ github.event.inputs.action }}
          DURATION: ${{ github.event.inputs.duration }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          USER_PASSWORD: ${{ github.event.inputs.user_password }}
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          cd bot
          python3 bot.py
      
      - name: 📸 Скриншот
        if: always()
        run: |
          export DISPLAY=:99
          sleep 5
          scrot /tmp/game_screenshot.png
      
      - name: 📤 Загрузка скриншота
        if: always()
        uses: actions/upload-artifact@v4  # ← Исправлено: v3 → v4
        with:
          name: game-screenshot
          path: /tmp/game_screenshot.png
      
      - name: 📤 Загрузка логов
        if: always()
        uses: actions/upload-artifact@v4  # ← Исправлено: v3 → v4
        with:
          name: bot-logs
          path: /tmp/bot.log