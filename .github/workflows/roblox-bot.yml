name: 🌐 Веб-сервер

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование
        uses: actions/checkout@v4
      
      - name: 🐍 Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Установка зависимостей
        run: |
          pip install flask flask-cors requests
      
      - name: 🚀 Запуск сервера в фоне
        run: |
          python server.py &
          sleep 10
          echo "✅ Сервер запущен"
      
      - name: 🔍 Проверка сервера
        run: |
          curl -v http://localhost:5000 || echo "⚠️ Сервер не отвечает"
      
      - name: 📋 Логи сервера
        if: always()
        run: |
          ps aux | grep python
          netstat -tlnp 2>/dev/null || ss -tlnp