name: 🤖 Roblox Bot

on:
  workflow_dispatch:
    inputs:
      game_link:
        description: '🔗 Ссылка на игру'
        required: true
        type: string
      action:
        description: '🎯 Действие'
        required: true
        type: choice
        options:
          - stand_and_wait
          - walk_to_player
          - take_item
          - leave_game
      duration:
        description: '⏱ Время (сек)'
        required: false
        type: string
        default: '60'
      target_nick:
        description: '👤 Кому отправить запрос'
        required: false
        type: string
        default: 'ВашНик'

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Setup Wine & dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 xvfb xdotool scrot
          pip install requests pyautogui
      
      - name: Install Roblox
        run: |
          wget https://setup.rbxcdn.com/RobloxPlayerLauncher.exe -O /tmp/RobloxPlayerLauncher.exe
          WINEPREFIX=/home/runner/.wine wine /tmp/RobloxPlayerLauncher.exe /silent
          sleep 30
          echo "✅ Roblox установлен!"
      
      - name: Run Bot
        env:
          GAME_LINK: ${{ github.event.inputs.game_link }}
          ACTION: ${{ github.event.inputs.action }}
          DURATION: ${{ github.event.inputs.duration }}
          TARGET_NICK: ${{ github.event.inputs.target_nick }}
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          # Запускаем Xvfb с правильными параметрами
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          sleep 3
          export DISPLAY=:99
          
          # Проверяем, что Xvfb запущен
          xdpyinfo -display :99 > /dev/null 2>&1 || { echo "❌ Xvfb не запущен!"; exit 1; }
          
          echo "✅ Xvfb запущен на :99"
          python bot.py