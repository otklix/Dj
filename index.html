<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🤖 Roblox Bot Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(0,200,255,0.03) 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 50%, rgba(180,0,255,0.03) 0%, transparent 60%);
        }

        .container {
            max-width: 540px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
            transition: 0.3s;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f0ff, #b400ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .sub {
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 26px;
        }

        .slide-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.5s ease,
                        margin 0.4s ease;
            opacity: 0;
            margin-bottom: 0;
        }

        .slide-panel.open {
            max-height: 400px;
            opacity: 1;
            margin-bottom: 18px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            transition: 0.25s;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #00c8ff;
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.08);
        }

        .password-input {
            letter-spacing: 2px;
            font-size: 1rem;
        }

        .hint {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.1);
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c8ff, #7b2ffc);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 200, 255, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #00d48a, #00a86b);
            color: #fff;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 138, 0.2);
        }

        .btn-danger {
            background: rgba(255, 60, 80, 0.15);
            border: 1px solid rgba(255, 60, 80, 0.2);
            color: #ff6b7a;
        }

        .btn-danger:hover {
            background: rgba(255, 60, 80, 0.25);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-group .btn {
            flex: 1;
            margin-top: 0;
        }

        .status {
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            margin: 14px 0 10px;
        }

        .status .online { color: #3bff9e; }
        .status .error { color: #ff5e7a; }
        .status .loading { color: #ffb347; }

        .log {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 10px 14px;
            max-height: 100px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.02);
            margin-top: 4px;
        }

        .log::-webkit-scrollbar {
            width: 3px;
        }
        .log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
        }

        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.015);
        }

        .log-entry .time {
            color: rgba(255, 255, 255, 0.1);
            margin-right: 8px;
        }

        .log-entry.success { color: #3bff9e; }
        .log-entry.error { color: #ff5e7a; }
        .log-entry.info { color: rgba(255, 255, 255, 0.4); }
        .log-entry.system { color: #6fcbff; }

        .lottery-box {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            user-select: none;
            margin-top: 4px;
        }

        .lottery-box:hover {
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.02);
        }

        .lottery-box .scratch {
            font-size: 1.6rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.1);
            letter-spacing: 6px;
            transition: 0.4s;
        }

        .lottery-box .scratch.revealed {
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            letter-spacing: 2px;
        }

        .lottery-box .scratch-hint {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.08);
            margin-top: 6px;
        }

        .lottery-box .scratch-hint.revealed {
            color: rgba(255, 215, 0, 0.2);
        }

        .badge {
            display: inline-block;
            background: rgba(0, 200, 255, 0.06);
            color: rgba(0, 200, 255, 0.3);
            font-size: 0.55rem;
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid rgba(0, 200, 255, 0.04);
        }

        .footer {
            text-align: center;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.04);
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }

        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            h1 { font-size: 1.5rem; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { flex: none; }
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <h1>🤖 Roblox Bot</h1>
        <div class="sub">Управление ботом <span class="badge">🔐 Защищено</span></div>

        <!-- ===== КНОПКА ВХОДА ===== -->
        <button class="btn btn-primary" onclick="toggleLogin()">
            🔑 ВОЙТИ В АККАУНТ БОТА
        </button>

        <!-- ===== ПЛАВНАЯ ПАНЕЛЬ (ПАРОЛЬ) ===== -->
        <div class="slide-panel" id="loginPanel">
            <div class="input-group">
                <label>🔐 Пароль аккаунта бота</label>
                <input type="password" id="botPassword" class="password-input" placeholder="Введите пароль от аккаунта..." />
                <div class="hint">Пароль, который вы установили для бота</div>
            </div>
            <button class="btn btn-success" onclick="loginBot()">✅ ВОЙТИ</button>
        </div>

        <!-- ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== -->
        <div id="controlPanel" style="display: none;">

            <!-- ССЫЛКА -->
            <div class="input-group">
                <label>🔗 Ссылка на игру</label>
                <textarea id="gameLink" placeholder="Вставьте ссылку на приватный сервер...">https://www.roblox.com/games/123456789/Private-Server</textarea>
            </div>

            <!-- ДЕЙСТВИЕ -->
            <div class="input-group">
                <label>🎯 Действие</label>
                <select id="botAction">
                    <option value="stand_and_wait">🧍 Стоять и ждать</option>
                    <option value="walk_to_player">🚶 Подойти к игроку</option>
                    <option value="take_item">📦 Забрать предмет</option>
                    <option value="leave_game">🚪 Выйти из игры</option>
                </select>
            </div>

            <!-- НИК -->
            <div class="input-group">
                <label>👤 Ваш ник в Roblox</label>
                <input type="text" id="playerNick" placeholder="Ваш ник..." value="ВашНик" />
            </div>

            <!-- ВРЕМЯ -->
            <div class="input-group">
                <label>⏱ Время (сек)</label>
                <input type="number" id="duration" value="60" min="1" max="3600" />
            </div>

            <!-- КНОПКИ -->
            <button class="btn btn-primary" onclick="executeBot()">🚀 ЗАПУСТИТЬ БОТА</button>

            <div class="btn-group">
                <button class="btn btn-danger" onclick="stopBot()">⛔ ОСТАНОВИТЬ</button>
                <button class="btn btn-outline" onclick="logoutBot()">🚪 ВЫЙТИ</button>
            </div>

            <!-- СОЗДАНИЕ АККАУНТА -->
            <button class="btn btn-success" onclick="createAccount()" style="margin-top: 10px;">
                🆕 СОЗДАТЬ НОВЫЙ АККАУНТ
            </button>

            <!-- ЛОТЕРЕЯ (ПОЛУЧИТЬ ПАРОЛЬ) -->
            <div class="lottery-box" onclick="revealPassword()" id="lotteryBox">
                <div class="scratch" id="scratchText">████████████</div>
                <div class="scratch-hint" id="scratchHint">🖱 Нажмите, чтобы стереть и увидеть пароль</div>
            </div>

            <!-- СТАТУС -->
            <div class="status" id="status">
                Статус: <span class="online">● Бот готов</span>
            </div>

            <!-- ЛОГ -->
            <div class="log" id="logContainer">
                <div class="log-entry system">
                    <span class="time">[00:00:00]</span>
                    🔐 Бот авторизован. Введите команду.
                </div>
            </div>

        </div>

        <div class="footer">
            ⚡ Работает через GitHub Actions
        </div>

    </div>

    <script>
        // ===== КОНФИГ (ВАШ НИК И РЕПОЗИТОРИЙ) =====
        const GITHUB_USER = 'otklix';
        const REPO_NAME = 'dj';

        // ===== СОСТОЯНИЕ =====
        let isLoggedIn = false;
        let generatedPassword = '';

        // ===== ВХОД (ПЛАВНО) =====
        function toggleLogin() {
            const panel = document.getElementById('loginPanel');
            panel.classList.toggle('open');
        }

        function loginBot() {
            const password = document.getElementById('botPassword').value.trim();

            if (!password) {
                addLog('error', '❌ Введите пароль!');
                return;
            }

            if (password.length < 4) {
                addLog('error', '❌ Слишком короткий пароль!');
                return;
            }

            isLoggedIn = true;
            document.getElementById('loginPanel').classList.remove('open');
            document.getElementById('controlPanel').style.display = 'block';
            document.getElementById('status').innerHTML = 'Статус: <span class="online">● Бот авторизован</span>';
            addLog('success', '✅ Вход выполнен успешно!');
            addLog('info', '📌 Теперь вы можете управлять ботом.');
        }

        // ===== ЗАПУСК БОТА =====
        async function executeBot() {
            if (!isLoggedIn) {
                addLog('error', '❌ Сначала войдите в аккаунт бота!');
                return;
            }

            const link = document.getElementById('gameLink').value.trim();
            const nick = document.getElementById('playerNick').value.trim();
            const action = document.getElementById('botAction').value;
            const duration = document.getElementById('duration').value;

            if (!link.includes('roblox.com')) {
                addLog('error', '❌ Введите ссылку на Roblox!');
                return;
            }
            if (!nick) {
                addLog('error', '❌ Введите ваш ник!');
                return;
            }

            addLog('info', `🎯 Отправляю команду "${action}" для ${nick}`);
            setStatus('Отправка...', 'loading');

            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/actions/workflows/roblox-bot.yml/dispatches`,
                    {
                        method: 'POST',
                        headers: { 'Accept': 'application/vnd.github.v3+json' },
                        body: JSON.stringify({
                            ref: 'main',
                            inputs: {
                                game_link: link,
                                action: action,
                                duration: String(duration),
                                user_password: document.getElementById('botPassword').value.trim()
                            }
                        })
                    }
                );

                if (response.status === 204) {
                    addLog('success', `✅ Бот запущен! Действие: ${action}`);
                    setStatus('Бот запущен ✅', 'online');
                } else if (response.status === 401 || response.status === 403) {
                    addLog('error', '❌ Репозиторий должен быть публичным!');
                    setStatus('Ошибка доступа ❌', 'error');
                } else {
                    addLog('error', `❌ Ошибка: ${response.status}`);
                    setStatus('Ошибка ❌', 'error');
                }
            } catch (error) {
                addLog('error', `❌ Ошибка: ${error.message}`);
                setStatus('Ошибка ❌', 'error');
            }
        }

        // ===== ОСТАНОВКА =====
        function stopBot() {
            addLog('info', '⛔ Останавливаю бота...');
            setStatus('Остановка ⏹', 'online');
            addLog('info', '📌 Остановите вручную на вкладке Actions GitHub');
        }

        // ===== ВЫХОД =====
        function logoutBot() {
            isLoggedIn = false;
            document.getElementById('controlPanel').style.display = 'none';
            document.getElementById('status').innerHTML = 'Статус: <span class="online">● Ожидание входа</span>';
            addLog('success', '🚪 Выход выполнен. Сессия завершена.');
            addLog('info', '💡 Данные автоматически удалены.');
        }

        // ===== СОЗДАНИЕ АККАУНТА =====
        function createAccount() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let name = '';
            for (let i = 0; i < 10; i++) {
                name += chars[Math.floor(Math.random() * chars.length)];
            }

            const passChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';
            let password = '';
            for (let i = 0; i < 12; i++) {
                password += passChars[Math.floor(Math.random() * passChars.length)];
            }

            generatedPassword = password;

            addLog('success', `🆕 Создан аккаунт: ${name}`);
            addLog('info', `🔐 Пароль сохранён. Нажмите "Получить пароль", чтобы увидеть его.`);

            document.getElementById('scratchText').textContent = '████████████';
            document.getElementById('scratchText').classList.remove('revealed');
            document.getElementById('scratchHint').textContent = '🖱 Нажмите, чтобы стереть и увидеть пароль';
            document.getElementById('scratchHint').classList.remove('revealed');
            document.getElementById('lotteryBox').dataset.password = password;

            setStatus('Аккаунт создан ✅', 'online');
        }

        // ===== ЛОТЕРЕЯ (СТИРАНИЕ) =====
        function revealPassword() {
            const box = document.getElementById('lotteryBox');
            const text = document.getElementById('scratchText');
            const hint = document.getElementById('scratchHint');

            if (!box.dataset.password) {
                addLog('info', '💡 Сначала создайте аккаунт!');
                return;
            }

            if (text.classList.contains('revealed')) {
                addLog('info', '🔐 Пароль уже показан');
                return;
            }

            text.textContent = box.dataset.password;
            text.classList.add('revealed');
            hint.textContent = '✅ Пароль получен! Сохраните его.';
            hint.classList.add('revealed');

            addLog('success', `🔐 Пароль: ${box.dataset.password}`);
            setStatus('Пароль получен 🔐', 'online');

            box.style.transition = '0.3s';
            box.style.borderColor = '#ffd700';
            setTimeout(() => {
                box.style.borderColor = '';
            }, 1500);
        }

        // ===== СТАТУС =====
        function setStatus(text, type) {
            document.getElementById('status').innerHTML = `Статус: <span class="${type}">● ${text}</span>`;
        }

        // ===== ЛОГ =====
        function addLog(type, message) {
            const log = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            log.prepend(entry);
            while (log.children.length > 50) log.removeChild(log.lastChild);
        }

        // ===== ENTER =====
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('botPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') loginBot();
            });
            addLog('system', '🔐 Нажмите "ВОЙТИ В АККАУНТ БОТА" для начала');
            addLog('info', `📌 Репозиторий: ${GITHUB_USER}/${REPO_NAME}`);
        });
    </script>

</body>
</html>
