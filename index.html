<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🤖 Roblox Bot Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0b1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-card {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            transition: 0.3s;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f0ff, #b400ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .sub {
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            transition: 0.25s;
            outline: none;
        }

        textarea {
            min-height: 60px;
            resize: vertical;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #00c8ff;
            box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.1);
        }

        select option {
            background: #15152a;
            color: #fff;
        }

        .password-input {
            letter-spacing: 2px;
            font-size: 1rem;
        }

        .hint {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00c8ff, #7b2ffc);
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 200, 255, 0.25);
        }

        .btn-danger {
            width: 100%;
            padding: 14px;
            background: rgba(255, 60, 80, 0.12);
            border: 1px solid rgba(255, 60, 80, 0.2);
            border-radius: 14px;
            color: #ff6b7a;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .btn-danger:hover {
            background: rgba(255, 60, 80, 0.2);
        }

        .status {
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.25);
            margin: 16px 0 10px;
        }

        .status .online {
            color: #3bff9e;
        }
        .status .error {
            color: #ff5e7a;
        }
        .status .loading {
            color: #ffb347;
        }

        .log {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 12px 14px;
            max-height: 110px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .log::-webkit-scrollbar {
            width: 3px;
        }

        .log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .log-entry .time {
            color: rgba(255, 255, 255, 0.15);
            margin-right: 8px;
        }

        .log-entry.success {
            color: #3bff9e;
        }
        .log-entry.error {
            color: #ff5e7a;
        }
        .log-entry.info {
            color: rgba(255, 255, 255, 0.5);
        }
        .log-entry.system {
            color: #6fcbff;
        }

        .footer {
            text-align: center;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.06);
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .github-link {
            color: rgba(255, 255, 255, 0.08);
            text-decoration: none;
            transition: 0.2s;
        }

        .github-link:hover {
            color: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 22px 16px;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card">

        <h1>🤖 Roblox Bot</h1>
        <div class="sub">Управление ботом через облако</div>

        <!-- ПАРОЛЬ -->
        <div class="input-group">
            <label>🔐 Пароль</label>
            <input type="password" id="botPassword" class="password-input" placeholder="Введите пароль из GitHub Secrets" />
            <div class="hint">Пароль, который вы создали в настройках репозитория</div>
        </div>

        <!-- ССЫЛКА -->
        <div class="input-group">
            <label>🔗 Ссылка на игру</label>
            <textarea id="gameLink" placeholder="Вставьте ссылку на приватный сервер...">https://www.roblox.com/games/123456789/Private-Server</textarea>
        </div>

        <!-- ДЕЙСТВИЕ -->
        <div class="input-group">
            <label>🎯 Действие</label>
            <select id="botAction">
                <option value="stand_and_wait">🧍 Стоять и ждать</option>
                <option value="walk_to_player">🚶 Подойти к игроку</option>
                <option value="take_item">📦 Забрать предмет</option>
                <option value="leave_game">🚪 Выйти из игры</option>
            </select>
        </div>

        <!-- НИК -->
        <div class="input-group">
            <label>👤 Ваш ник в Roblox</label>
            <input type="text" id="playerNick" placeholder="Например: MyCoolName" value="ВашНик" />
        </div>

        <!-- ВРЕМЯ -->
        <div class="input-group">
            <label>⏱ Время ожидания (сек)</label>
            <input type="number" id="duration" value="60" min="1" max="3600" />
        </div>

        <!-- КНОПКИ -->
        <button class="btn-primary" onclick="executeBot()">🚀 ЗАПУСТИТЬ БОТА</button>
        <button class="btn-danger" onclick="stopBot()">⛔ ОСТАНОВИТЬ</button>

        <!-- СТАТУС -->
        <div class="status" id="status">
            Статус: <span class="online">● Готов к работе</span>
        </div>

        <!-- ЛОГ -->
        <div class="log" id="logContainer">
            <div class="log-entry system">
                <span class="time">[00:00:00]</span>
                🔐 Введите пароль и запустите бота
            </div>
        </div>

        <div class="footer">
            <a href="#" class="github-link">⚡ Работает через GitHub Actions</a>
        </div>

    </div>

    <script>
        // ===== КОНФИГ =====
        const GITHUB_USER = 'ВАШ_НИК_НА_GITHUB'; // ← ИЗМЕНИТЕ
        const REPO_NAME = 'Roblox-Cloud-Bot';     // ← ИЗМЕНИТЕ

        // ===== ЛОГ =====
        function addLog(type, message) {
            const log = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            log.prepend(entry);
            while (log.children.length > 50) log.removeChild(log.lastChild);
        }

        function setStatus(text, type) {
            document.getElementById('status').innerHTML = `Статус: <span class="${type}">● ${text}</span>`;
        }

        // ===== ЗАПУСК =====
        async function executeBot() {
            const password = document.getElementById('botPassword').value.trim();
            const link = document.getElementById('gameLink').value.trim();
            const nick = document.getElementById('playerNick').value.trim();
            const action = document.getElementById('botAction').value;
            const duration = document.getElementById('duration').value;

            if (!password) { addLog('error', '❌ Введите пароль!'); return; }
            if (!link.includes('roblox.com')) { addLog('error', '❌ Введите ссылку Roblox!'); return; }
            if (!nick) { addLog('error', '❌ Введите ваш ник!'); return; }

            addLog('info', `🎯 Отправляю команду "${action}" для ${nick}`);
            setStatus('Отправка...', 'loading');

            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/actions/workflows/roblox-bot.yml/dispatches`,
                    {
                        method: 'POST',
                        headers: { 'Accept': 'application/vnd.github.v3+json' },
                        body: JSON.stringify({
                            ref: 'main',
                            inputs: {
                                game_link: link,
                                action: action,
                                duration: String(duration),
                                user_password: password
                            }
                        })
                    }
                );

                if (response.status === 204) {
                    addLog('success', `✅ Бот запущен! Действие: ${action}`);
                    setStatus('Бот запущен ✅', 'online');
                } else if (response.status === 401 || response.status === 403) {
                    addLog('error', '❌ Ошибка авторизации! Репозиторий должен быть публичным');
                    setStatus('Ошибка авторизации ❌', 'error');
                } else {
                    addLog('error', `❌ Ошибка: ${response.status}`);
                    setStatus('Ошибка ❌', 'error');
                }
            } catch (error) {
                addLog('error', `❌ Ошибка: ${error.message}`);
                setStatus('Ошибка соединения ❌', 'error');
            }
        }

        // ===== ОСТАНОВКА =====
        function stopBot() {
            addLog('info', '⛔ Остановка...');
            setStatus('Остановка ⏹', 'online');
            addLog('info', '📌 Остановите вручную на вкладке Actions GitHub');
        }

        // ===== ENTER =====
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('botPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') executeBot();
            });
            addLog('system', '🔐 Система готова. Введите пароль и запустите бота.');
        });
    </script>

</body>
</html>
