<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS 18.7 Simulator</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="iphone-15-pro">
        <div class="notch">
            <div class="camera"></div>
            <div class="speaker"></div>
        </div>
        
        <div class="screen" id="screen">
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="time" id="clock">09:41</div>
                <div class="indicators">
                    <span class="signal">📶</span>
                    <span class="wifi">⚡</span>
                    <span class="battery">100% 🔋</span>
                </div>
            </div>

            <!-- Main UI -->
            <div id="springboard" class="active-layer">
                <div class="app-grid" id="app-grid"></div>
                <div class="dock-container">
                    <div class="dock" id="dock"></div>
                </div>
            </div>

            <!-- App Layer -->
            <div id="app-window" class="hidden">
                <div class="app-header">
                    <button onclick="closeApp()">✕</button>
                    <span id="app-title">App</span>
                </div>
                <div id="app-content"></div>
            </div>

            <!-- Home Indicator -->
            <div class="home-indicator" onclick="closeApp()"></div>
        </div>
        
        <div id="toast" class="toast hidden"></div>
    </div>

    <!-- Scripts -->
    <script src="js/filesystem.js"></script>
    <script src="js/springboard.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/wallpapers.js"></script>
    <script src="js/appstore.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/fieldtest.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
