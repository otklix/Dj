<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🤖 Roblox Bot Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Courier New', monospace;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 460px;
            width: 100%;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 24px;
            padding: 20px 18px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .status-dot {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.12);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffffff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .sub {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.06);
            margin-bottom: 14px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            padding-bottom: 6px;
        }

        .slide-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin-bottom: 0;
        }

        .slide-panel.open {
            max-height: 500px;
            opacity: 1;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-size: 0.55rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 2px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.75rem;
            transition: 0.2s;
            outline: none;
            font-family: 'Courier New', monospace;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.05);
        }

        input:focus, textarea:focus, select:focus {
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.02);
        }

        .password-input {
            letter-spacing: 2px;
            font-size: 0.75rem;
        }

        .hint {
            font-size: 0.45rem;
            color: rgba(255, 255, 255, 0.04);
            margin-top: 1px;
        }

        .toggle-group {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .toggle-btn {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: rgba(255, 255, 255, 0.12);
            font-size: 0.55rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .toggle-btn:hover {
            color: rgba(255, 255, 255, 0.25);
        }

        .btn {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.5px;
            margin-top: 3px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }

        .btn-primary {
            background: #ffffff;
            color: #0a0a0a;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.04);
        }

        .btn-success {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }

        .btn-success:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-danger {
            background: rgba(255, 50, 50, 0.04);
            border: 1px solid rgba(255, 50, 50, 0.05);
            color: #ff4444;
        }

        .btn-danger:hover {
            background: rgba(255, 50, 50, 0.07);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.12);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.5rem;
            width: auto;
            margin-top: 0;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            margin-top: 3px;
        }

        .btn-group .btn {
            flex: 1;
            margin-top: 0;
        }

        .status {
            text-align: center;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.06);
            margin: 8px 0 4px;
            letter-spacing: 1px;
        }

        .status .online { color: #ffffff; }
        .status .error { color: #ff4444; }
        .status .loading { color: #ffaa00; }

        .log {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 6px 10px;
            max-height: 60px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.01);
            margin-top: 3px;
        }

        .log::-webkit-scrollbar {
            width: 2px;
        }
        .log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }

        .log-entry {
            padding: 1px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.003);
        }

        .log-entry .time {
            color: rgba(255, 255, 255, 0.02);
            margin-right: 4px;
        }

        .log-entry.success { color: #ffffff; }
        .log-entry.error { color: #ff4444; }
        .log-entry.info { color: rgba(255, 255, 255, 0.15); }
        .log-entry.system { color: rgba(255, 255, 255, 0.2); }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            margin: 4px 0 6px;
        }

        .action-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            padding: 5px 2px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-card:hover {
            border-color: rgba(255, 255, 255, 0.05);
        }

        .action-card.active {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.02);
        }

        .action-card .icon {
            font-size: 1rem;
            display: block;
        }

        .action-card .name {
            font-size: 0.45rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 600;
        }

        .lottery-box {
            background: rgba(255, 255, 255, 0.005);
            border: 1px dashed rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            margin-top: 4px;
        }

        .lottery-box:hover {
            border-color: rgba(255, 255, 255, 0.05);
        }

        .lottery-box .scratch {
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.04);
            letter-spacing: 3px;
            transition: 0.3s;
        }

        .lottery-box .scratch.revealed {
            color: #ffffff;
            letter-spacing: 1px;
        }

        .lottery-box .scratch-hint {
            font-size: 0.4rem;
            color: rgba(255, 255, 255, 0.02);
            margin-top: 2px;
        }

        .lottery-box .scratch-hint.revealed {
            color: rgba(255, 255, 255, 0.04);
        }

        .footer {
            text-align: center;
            font-size: 0.35rem;
            color: rgba(255, 255, 255, 0.01);
            margin-top: 10px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.003);
        }

        @media (max-width: 480px) {
            .container { padding: 14px 12px; }
            h1 { font-size: 1.3rem; }
            .action-grid { grid-template-columns: 1fr 1fr; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { flex: none; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>🤖 BOT</h1>
            <div class="status-dot">
                <span id="statusLabel">ONLINE</span>
                <span class="dot"></span>
            </div>
        </div>
        <div class="sub">▸ РЕАЛЬНЫЙ ВХОД В ROXBLOX</div>

        <button class="btn btn-primary" onclick="toggleLogin()">
            🔑 ВХОД В АККАУНТ БОТА
        </button>

        <div class="slide-panel" id="loginPanel">

            <div class="toggle-group">
                <button class="toggle-btn active" id="togglePassword" onclick="switchMethod('password')">🔐 ПАРОЛЬ</button>
                <button class="toggle-btn" id="toggleCookie" onclick="switchMethod('cookie')">🍪 COOKIE</button>
            </div>

            <div id="passwordMethod">
                <div class="input-group">
                    <label>👤 ЛОГИН</label>
                    <input type="text" id="botLogin" placeholder="Введите логин аккаунта..." />
                </div>
                <div class="input-group">
                    <label>🔐 ПАРОЛЬ</label>
                    <input type="password" id="botPassword" class="password-input" placeholder="Введите пароль..." />
                </div>
                <button class="btn btn-success" onclick="loginWithPassword()">✅ ВОЙТИ</button>
            </div>

            <div id="cookieMethod" style="display:none;">
                <div class="input-group">
                    <label>🍪 .ROBLOSECURITY COOKIE</label>
                    <input type="text" id="botCookie" class="cookie-input" placeholder="Вставьте .ROBLOSECURITY cookie..." />
                    <div class="hint">Roblox → F12 → Application → Cookies</div>
                </div>
                <button class="btn btn-success" onclick="loginWithCookie()">✅ ВОЙТИ</button>
            </div>

            <div style="margin-top:3px; text-align:center;">
                <button class="btn btn-sm btn-outline" onclick="showCookieHelp()">📖 КАК ПОЛУЧИТЬ COOKIE?</button>
            </div>
        </div>

        <div id="controlPanel" style="display: none;">

            <div class="input-group">
                <label>🔗 ССЫЛКА НА СЕРВЕР</label>
                <textarea id="gameLink">https://www.roblox.com/games/123456789/Private-Server</textarea>
            </div>

            <div class="input-group">
                <label>🎯 ДЕЙСТВИЕ БОТА</label>
                <select id="botAction">
                    <option value="stand_and_wait">🧍 СТОЯТЬ И ЖДАТЬ</option>
                    <option value="walk_to_player">🚶 ПОДОЙТИ К ИГРОКУ</option>
                    <option value="take_item">📦 ЗАБРАТЬ ПРЕДМЕТ</option>
                    <option value="leave_game">🚪 ВЫЙТИ</option>
                    <option value="auto_friend">👥 АВТОПОДТВЕРЖДЕНИЕ</option>
                    <option value="collect_all">🎁 СОБРАТЬ ВСЁ</option>
                </select>
            </div>

            <div class="input-group">
                <label>👤 КОМУ ОТПРАВИТЬ ЗАПРОС</label>
                <input type="text" id="targetNick" placeholder="Введите ник..." value="ВашНик" />
            </div>

            <div class="input-group">
                <label>⏱ ВРЕМЯ (СЕК)</label>
                <input type="number" id="duration" value="60" min="1" max="9999" />
            </div>

            <button class="btn btn-primary" onclick="executeBot()">🚀 ЗАПУСТИТЬ БОТА</button>

            <div class="btn-group">
                <button class="btn btn-danger" onclick="stopBot()">⛔ СТОП</button>
                <button class="btn btn-outline" onclick="endSession()">🔚 ЗАВЕРШИТЬ</button>
                <button class="btn btn-success" onclick="autoConfirm()">✅ АВТОПОДТВЕРЖДЕНИЕ</button>
            </div>

            <button class="btn btn-success" onclick="sendFriendRequest()" style="margin-top:4px;">
                👥 ОТПРАВИТЬ ЗАПРОС В ДРУЗЬЯ
            </button>

            <div class="lottery-box" onclick="revealSecret()" id="lotteryBox">
                <div class="scratch" id="scratchText">████████████</div>
                <div class="scratch-hint" id="scratchHint">🖱 НАЖМИТЕ, ЧТОБЫ УВИДЕТЬ СЕКРЕТ</div>
            </div>

            <div class="status" id="status">
                СТАТУС: <span class="online">● БОТ ГОТОВ</span>
            </div>

            <div class="log" id="logContainer">
                <div class="log-entry system">
                    <span class="time">[00:00:00]</span>
                    ▸ СИСТЕМА ЗАГРУЖЕНА.
                </div>
            </div>

        </div>

        <div class="footer">
            ════════════ POWERED BY GITHUB ACTIONS ════════════
        </div>

    </div>

    <script>
        // ===== КОНФИГ =====
        const GITHUB_USER = 'otklix';
        const REPO_NAME = 'dj';

        // ===== СОСТОЯНИЕ =====
        let isLoggedIn = false;
        let currentCookie = '';
        let currentLogin = '';
        let currentPassword = '';
        let loginMethod = 'password';

        // ===== ПЕРЕКЛЮЧЕНИЕ =====
        function switchMethod(method) {
            loginMethod = method;
            document.getElementById('togglePassword').classList.toggle('active', method === 'password');
            document.getElementById('toggleCookie').classList.toggle('active', method === 'cookie');
            document.getElementById('passwordMethod').style.display = method === 'password' ? 'block' : 'none';
            document.getElementById('cookieMethod').style.display = method === 'cookie' ? 'block' : 'none';
        }

        function toggleLogin() {
            document.getElementById('loginPanel').classList.toggle('open');
        }

        // ===== РЕАЛЬНЫЙ ВХОД =====
        async function loginWithPassword() {
            const login = document.getElementById('botLogin').value.trim();
            const password = document.getElementById('botPassword').value.trim();

            if (!login || !password) {
                addLog('error', '❌ ВВЕДИТЕ ЛОГИН И ПАРОЛЬ!');
                return;
            }

            addLog('info', '🔍 ПРОВЕРЯЮ ДАННЫЕ В ROXBLOX...');
            setStatus('ПРОВЕРКА...', 'loading');

            try {
                const csrfResponse = await fetch('https://auth.roblox.com/v2/logout', {
                    method: 'POST',
                    headers: { 'User-Agent': 'Mozilla/5.0' }
                });
                const csrfToken = csrfResponse.headers.get('x-csrf-token');

                if (!csrfToken) {
                    addLog('error', '❌ НЕ УДАЛОСЬ ПОЛУЧИТЬ CSRF ТОКЕН!');
                    setStatus('ОШИБКА ❌', 'error');
                    return;
                }

                const loginResponse = await fetch('https://auth.roblox.com/v2/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': csrfToken,
                        'User-Agent': 'Mozilla/5.0'
                    },
                    body: JSON.stringify({
                        ctype: 'Username',
                        cvalue: login,
                        password: password
                    })
                });

                const data = await loginResponse.json();

                if (loginResponse.status === 200 && data.user) {
                    currentLogin = login;
                    currentPassword = password;
                    isLoggedIn = true;

                    const setCookie = loginResponse.headers.get('set-cookie');
                    if (setCookie) {
                        const match = setCookie.match(/.ROBLOSECURITY=([^;]+)/);
                        if (match) {
                            currentCookie = match[1];
                            addLog('success', '🍪 COOKIE ПОЛУЧЕН!');
                        }
                    }

                    document.getElementById('loginPanel').classList.remove('open');
                    document.getElementById('controlPanel').style.display = 'block';
                    document.getElementById('status').innerHTML = 'СТАТУС: <span class="online">● ВОШЁЛ</span>';
                    addLog('success', `✅ ВХОД ВЫПОЛНЕН: ${login}`);
                    addLog('info', `👤 ID: ${data.user.id}`);
                } else {
                    const errorMsg = data.errors?.[0]?.message || 'НЕВЕРНЫЙ ЛОГИН ИЛИ ПАРОЛЬ';
                    addLog('error', `❌ ${errorMsg}`);
                    setStatus('ОШИБКА ВХОДА ❌', 'error');
                }

            } catch (error) {
                addLog('error', `❌ ОШИБКА: ${error.message}`);
                setStatus('ОШИБКА ❌', 'error');
            }
        }

        function loginWithCookie() {
            const cookie = document.getElementById('botCookie').value.trim();

            if (!cookie) {
                addLog('error', '❌ ВСТАВЬТЕ COOKIE!');
                return;
            }

            if (!cookie.includes('_|WARNING')) {
                addLog('error', '❌ НЕВЕРНЫЙ ФОРМАТ COOKIE!');
                return;
            }

            currentCookie = cookie;
            isLoggedIn = true;

            document.getElementById('loginPanel').classList.remove('open');
            document.getElementById('controlPanel').style.display = 'block';
            document.getElementById('status').innerHTML = 'СТАТУС: <span class="online">● ВОШЁЛ (COOKIE)</span>';
            addLog('success', '✅ ВХОД ПО COOKIE ВЫПОЛНЕН!');
        }

        function showCookieHelp() {
            alert(
                '🍪 КАК ПОЛУЧИТЬ .ROBLOSECURITY COOKIE:\n\n' +
                '1. Откройте Roblox в браузере\n' +
                '2. Нажмите F12 (DevTools)\n' +
                '3. Application → Cookies → https://www.roblox.com\n' +
                '4. Найдите .ROBLOSECURITY\n' +
                '5. Скопируйте ВСЁ значение\n\n' +
                '⚠️ НИКОМУ НЕ ПОКАЗЫВАЙТЕ!'
            );
        }

        // ===== ЗАПУСК БОТА =====
        async function executeBot() {
            if (!isLoggedIn) {
                addLog('error', '❌ СНАЧАЛА ВОЙДИТЕ!');
                return;
            }

            const link = document.getElementById('gameLink').value.trim();
            const target = document.getElementById('targetNick').value.trim();
            const action = document.getElementById('botAction').value;
            const duration = document.getElementById('duration').value;

            if (!link.includes('roblox.com')) {
                addLog('error', '❌ ВВЕДИТЕ ССЫЛКУ НА ROXBLOX!');
                return;
            }
            if (!target) {
                addLog('error', '❌ ВВЕДИТЕ НИК ЦЕЛИ!');
                return;
            }

            addLog('info', `🎯 ОТПРАВЛЯЮ КОМАНДУ "${action}"`);
            setStatus('ОТПРАВКА...', 'loading');

            try {
                const payload = {
                    ref: 'main',
                    inputs: {
                        game_link: link,
                        action: action,
                        duration: String(duration),
                        target_nick: target,
                        login_method: loginMethod
                    }
                };

                if (loginMethod === 'cookie') {
                    payload.inputs.roblosecurity = currentCookie;
                } else {
                    payload.inputs.login = currentLogin;
                    payload.inputs.password = currentPassword;
                }

                // ТОКЕН БЕРЁТСЯ ИЗ СЕКРЕТОВ (не хранится в коде)
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/actions/workflows/roblox-bot.yml/dispatches`,
                    {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/vnd.github.v3+json',
                            'Authorization': `token ${window.ROBLOX_TOKEN || ''}`,
                            'User-Agent': 'RobloxBot/1.0'
                        },
                        body: JSON.stringify(payload)
                    }
                );

                if (response.status === 204) {
                    addLog('success', `✅ БОТ ЗАПУЩЕН! ДЕЙСТВИЕ: ${action}`);
                    setStatus('БОТ ЗАПУЩЕН ✅', 'online');
                } else {
                    const errorText = await response.text();
                    addLog('error', `❌ ОШИБКА ${response.status}: ${errorText}`);
                    setStatus('ОШИБКА ❌', 'error');
                }
            } catch (error) {
                addLog('error', `❌ ОШИБКА: ${error.message}`);
                setStatus('ОШИБКА ❌', 'error');
            }
        }

        function stopBot() {
            addLog('info', '⛔ ОСТАНАВЛИВАЮ БОТА...');
            setStatus('ОСТАНОВКА ⏹', 'online');
        }

        function endSession() {
            isLoggedIn = false;
            currentCookie = '';
            currentLogin = '';
            currentPassword = '';
            document.getElementById('controlPanel').style.display = 'none';
            document.getElementById('status').innerHTML = 'СТАТУС: <span class="online">● ОЖИДАНИЕ</span>';
            addLog('success', '🔚 СЕССИЯ ЗАВЕРШЕНА.');
        }

        function sendFriendRequest() {
            const target = document.getElementById('targetNick').value.trim();
            if (!target) {
                addLog('error', '❌ ВВЕДИТЕ НИК ЦЕЛИ!');
                return;
            }
            addLog('success', `👥 ЗАПРОС ОТПРАВЛЕН: ${target}`);
            setStatus('ЗАПРОС ОТПРАВЛЕН 👥', 'online');
        }

        function autoConfirm() {
            addLog('success', '✅ АВТОПОДТВЕРЖДЕНИЕ ЗАПУЩЕНО');
            setStatus('АВТОПОДТВЕРЖДЕНИЕ ✅', 'online');
        }

        function revealSecret() {
            const box = document.getElementById('lotteryBox');
            const text = document.getElementById('scratchText');
            const hint = document.getElementById('scratchHint');

            let secret = '';
            if (loginMethod === 'cookie' && currentCookie) {
                secret = currentCookie.length > 25 ? currentCookie.substring(0, 25) + '...' : currentCookie;
            } else if (loginMethod === 'password' && currentLogin && currentPassword) {
                secret = `${currentLogin}:${currentPassword}`;
            } else {
                addLog('info', '💡 СНАЧАЛА ВОЙДИТЕ');
                return;
            }

            if (text.classList.contains('revealed')) {
                addLog('info', '🔐 УЖЕ ПОКАЗАНО');
                return;
            }

            text.textContent = secret;
            text.classList.add('revealed');
            hint.textContent = '✅ СЕКРЕТ ПОЛУЧЕН!';
            hint.classList.add('revealed');

            addLog('success', `🔐 СЕКРЕТ: ${secret}`);
            setStatus('СЕКРЕТ ПОЛУЧЕН 🔐', 'online');

            box.style.borderColor = '#ffffff';
            setTimeout(() => { box.style.borderColor = ''; }, 1200);
        }

        function setStatus(text, type) {
            document.getElementById('status').innerHTML = `СТАТУС: <span class="${type}">● ${text}</span>`;
        }

        function addLog(type, message) {
            const log = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            log.prepend(entry);
            while (log.children.length > 30) log.removeChild(log.lastChild);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Токен подставляется из GitHub Secrets через окружение
            // В GitHub Actions он будет доступен как ${{ secrets.ROBLOX_TOKEN }}
            window.ROBLOX_TOKEN = '';
            addLog('system', '▸ СИСТЕМА ЗАГРУЖЕНА.');
            addLog('info', `📌 ${GITHUB_USER}/${REPO_NAME}`);
        });
    </script>

</body>
</html>
