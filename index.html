<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS 18.7 Simulator</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="iphone">
        <div class="screen" id="screen">
            <div class="status-bar">
                <span id="statusTime">12:54</span>
                <div class="status-icons">
                    <span>📶</span>
                    <span>📶</span>
                    <span>🔋 <span id="batteryLevel">100</span>%</span>
                </div>
            </div>
            <div class="notch"></div>
            <div id="homeScreen"></div>
            <div id="appContainer"></div>
            <div class="home-indicator" id="homeIndicator"></div>
            <div class="toast" id="toast"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/filesystem.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/appstore.js"></script>
    <script src="js/wallpapers.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/fieldtest.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/springboard.js"></script>
</body>
</html>
